name: ONEH immediate production deployment relay

on:
  deployment_status:

permissions:
  contents: read
  id-token: write

jobs:
  relay:
    if: github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Production'
    runs-on: ubuntu-latest
    steps:
      - name: Send verified GitHub deployment event to ONEH
        env:
          EVENT_JSON: ${{ toJson(github.event) }}
        run: |
          oidc_token=$(curl --fail --silent --show-error \
            --header "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=oneh-webhook" | jq -r '.value')
          test -n "$oidc_token"
          test "$oidc_token" != "null"
          response_code=$(curl --silent --show-error --output /tmp/oneh-response.txt --write-out "%{http_code}" \
            --request POST \
            --header "Content-Type: application/json" \
            --header "Authorization: Bearer $oidc_token" \
            --data-binary "$EVENT_JSON" \
            "https://oneh-webhook-live.eliecer-ruiz.workers.dev/hook")
          echo "ONEH webhook HTTP status: $response_code"
          cat /tmp/oneh-response.txt
          test "$response_code" -ge 200 && test "$response_code" -lt 300
